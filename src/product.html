<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bar and Product Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        /* Search Bar Styling */
        .search-container {
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
            display: flex;
        }
        .search-container input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* Product Card Styling */
        .product-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* Image Box Styling */
        .image-box {
            width: 100%;
            height: 200px;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Card Content Styling */
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .product-id {
            font-size: 12px;
            color: #888;
        }
        .product-category {
            font-size: 12px;
            background-color: #e2e8f0;
            color: #4a5568;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
            text-transform: uppercase;
            font-weight: bold;
        }
        .product-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        .product-price {
            font-size: 16px;
            color: #2b6cb0;
            font-weight: bold;
        }
        .product-description {
            font-size: 14px;
            color: #666;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Search Bar Component -->
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search products...">
        <button id="searchBtn">search</button>
    </div>

    <!-- Product Card Component -->
    <div class="product-card" data-id="101">
        <!-- Image Box -->
        <div class="image-box">
            <img src="" alt="Sample Product" id="img" >
        </div>
        
        <!-- Card Details -->
        <div class="card-content">
            <span class="product-id"></span>
            <span class="product-category"></span>
            <h3 class="product-title"></h3>
            <div class="product-price"></div>
            <p class="product-description">.</p>
        </div>
    </div>
    <script src="../dist/tut6.js"></script>
</body>
</html>
